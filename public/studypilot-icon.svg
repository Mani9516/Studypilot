<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <title>StudyPilot</title>
  <!-- High-contrast plate so the mark reads on glass / tinted sidebars -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#ffffff" stroke="#0e1a3a" stroke-width="2"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#sp-icon-bg)" opacity="0.95"/>
  <defs>
    <linearGradient id="sp-icon-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f0ff"/>
    </linearGradient>
  </defs>
  <!-- Mortarboard -->
  <path fill="#0e1a3a" d="M32 12 52 23 32 34 12 23 32 12Z"/>
  <path fill="#0e1a3a" d="M13 24v8l19 10 19-10v-8l-19 10L13 24Z"/>
  <!-- Head band -->
  <path fill="#152a52" d="M11 38c0-2 1.5-3.5 3.5-3.5h35c2 0 3.5 1.5 3.5 3.5v6H11v-6Z"/>
  <!-- Tassel -->
  <path fill="#7c3aed" d="M40 23v25h-4V23h4Z"/>
  <circle cx="38" cy="52" r="5" fill="#6d28d9" stroke="#4c1d95" stroke-width="1"/>
</svg>
